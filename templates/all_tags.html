{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <h2 class="mb-4">All Tags</h2>
    
    <div class="d-flex flex-wrap gap-3">
        {% for tag in tags %}
        <a href="#" class="text-decoration-none">
            <div class="badge bg-secondary p-3" style="font-size: 16px;">
                <i class="fa-solid fa-hashtag"></i> {{ tag.name }}
                <span class="badge bg-light text-dark ms-2">{{ tag.post_count }}</span>
            </div>
        </a>
        {% empty %}
        <p class="text-muted">No tags available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
